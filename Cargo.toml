[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui", "crates/telemetry"]

[workspace.package]
version = "0.4.2"
edition = "2024"
publish = false

[workspace.dependencies]
astrosharp-core = { path = "crates/core" }
astrosharp-telemetry = { path = "crates/telemetry" }
anyhow = "1"
thiserror = "2"
rayon = "1.12"
matrixmultiply = "0.3.11"
tiff = "0.11"
png = "0.18"
jpeg-encoder = "0.7"
zune-jpeg = "0.5.15"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.36"
rfd = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "internal-logs"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
